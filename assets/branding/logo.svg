<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" class="brand-logo-svg">
  <!-- Shield Frame -->
  <path d="M50 12 L85 27 V58 C85 76, 70 88, 50 92 C30 88, 15 76, 15 58 V27 L50 12 Z" stroke="url(#logo-grad)" stroke-width="8" stroke-linejoin="round" fill="none" />
  
  <!-- Crossed connection lines (API Integration) -->
  <path d="M33 38 L67 72" stroke="#0284c7" stroke-width="8" stroke-linecap="round" />
  <path d="M67 38 L33 72" stroke="#0d9488" stroke-width="8" stroke-linecap="round" />
  
  <!-- Central connection hub node -->
  <circle cx="50" cy="55" r="7" fill="#ffffff" stroke="#4f46e5" stroke-width="4" class="theme-fill" />
  
  <defs>
    <linearGradient id="logo-grad" x1="15" y1="12" x2="85" y2="92">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
  </defs>
  
  <style>
    @media (prefers-color-scheme: dark) {
      .theme-fill { fill: #090d16 !important; }
    }
  </style>
</svg>
